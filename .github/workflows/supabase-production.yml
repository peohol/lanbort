name: Supabase production

# Deploys migrations and Auth configuration to the hosted Supabase project with
# the Supabase CLI. Manual only, from main. The project is the one named in
# `[remotes.production]` in supabase/config.toml, whose overrides apply here.

on:
  workflow_dispatch:
    inputs:
      action:
        description: What to do
        type: choice
        default: status
        options:
          - status
          - migrate-dry-run
          - migrate
          - repair
          - config-diff
          - config-push
      repair_status:
        description: "repair only: mark the versions as applied or reverted"
        type: choice
        default: applied
        options:
          - applied
          - reverted
      repair_versions:
        description: "repair only: migration versions, separated by spaces"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: supabase-production
  cancel-in-progress: false

jobs:
  supabase:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      # Optional. Without it the CLI signs in with a temporary login role.
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      # Send-only Resend API key for Auth's SMTP (supabase/config.toml).
      SUPABASE_AUTH_SMTP_PASSWORD: ${{ secrets.SUPABASE_AUTH_SMTP_PASSWORD }}

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install pnpm
        run: npm install --global --allow-scripts=pnpm pnpm@12.8.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Link the production project
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::The SUPABASE_ACCESS_TOKEN repository secret is missing."
            exit 1
          fi
          ref="$(sed -n '/^\[remotes\.production\]/,/^\[/s/^project_id = "\([a-z]*\)"$/\1/p' supabase/config.toml)"
          if [ -z "$ref" ]; then
            echo "::error::No project_id under [remotes.production] in supabase/config.toml."
            exit 1
          fi
          pnpm exec supabase link --project-ref "$ref"

      - name: Run ${{ inputs.action }}
        env:
          ACTION: ${{ inputs.action }}
          REPAIR_STATUS: ${{ inputs.repair_status }}
          REPAIR_VERSIONS: ${{ inputs.repair_versions }}
        run: |
          case "$ACTION" in
            status) pnpm exec supabase migration list --linked ;;
            migrate-dry-run) pnpm exec supabase db push --linked --dry-run ;;
            migrate)
              pnpm exec supabase db push --linked --yes
              pnpm exec supabase migration list --linked
              ;;
            repair)
              if ! printf '%s' "$REPAIR_VERSIONS" | grep -Eq '^[0-9]{14}( [0-9]{14})*$'; then
                echo "::error::repair_versions must be 14-digit versions separated by single spaces."
                exit 1
              fi
              # shellcheck disable=SC2086 # one argument per version
              pnpm exec supabase migration repair --linked --status "$REPAIR_STATUS" $REPAIR_VERSIONS
              pnpm exec supabase migration list --linked
              ;;
            config-diff) pnpm exec supabase config diff ;;
            config-push)
              # Without the key the CLI would push an empty SMTP password and
              # sign-in codes would stop arriving.
              if [ -z "$SUPABASE_AUTH_SMTP_PASSWORD" ]; then
                echo "::error::The SUPABASE_AUTH_SMTP_PASSWORD repository secret is missing."
                exit 1
              fi
              pnpm exec supabase config push --yes
              pnpm exec supabase config diff
              ;;
          esac
