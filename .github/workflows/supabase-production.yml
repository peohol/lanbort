name: Supabase production

# Deploys migrations and Auth configuration to the hosted Supabase project with
# the Supabase CLI, and lists the daily backups Supabase takes of it
# (`backups`). Manual only, from main. The project is the one named in
# `[remotes.production]` in supabase/config.toml, whose overrides apply here.

on:
  workflow_dispatch:
    inputs:
      action:
        description: What to do
        type: choice
        default: status
        options:
          - status
          - migrate-dry-run
          - migrate
          - repair
          - config-diff
          - config-push
          - backups
      include_all:
        description: "migrate only: also apply migrations older than the newest in production, merged after it was deployed"
        type: boolean
        default: false
      repair_status:
        description: "repair only: mark the versions as applied or reverted"
        type: choice
        default: applied
        options:
          - applied
          - reverted
      repair_versions:
        description: "repair only: migration versions, separated by spaces"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: supabase-production
  cancel-in-progress: false

jobs:
  supabase:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      # Optional. Without it the CLI signs in with a temporary login role.
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      # Send-only Resend API key for Auth's SMTP (supabase/config.toml).
      SUPABASE_AUTH_SMTP_PASSWORD: ${{ secrets.SUPABASE_AUTH_SMTP_PASSWORD }}

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install pnpm
        run: npm install --global --allow-scripts=pnpm pnpm@12.8.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Link the production project
        run: |
          ref="$(scripts/ops/link-production.sh)"
          echo "PROJECT_REF=$ref" >> "$GITHUB_ENV"

      - name: Run ${{ inputs.action }}
        env:
          ACTION: ${{ inputs.action }}
          INCLUDE_ALL: ${{ inputs.include_all }}
          REPAIR_STATUS: ${{ inputs.repair_status }}
          REPAIR_VERSIONS: ${{ inputs.repair_versions }}
        run: |
          include_all=()
          [[ "$INCLUDE_ALL" == "true" ]] && include_all=(--include-all)
          case "$ACTION" in
            status) pnpm exec supabase migration list --linked ;;
            migrate-dry-run) pnpm exec supabase db push --linked --dry-run "${include_all[@]}" ;;
            migrate)
              pnpm exec supabase db push --linked --yes "${include_all[@]}"
              pnpm exec supabase migration list --linked
              ;;
            repair)
              if ! printf '%s' "$REPAIR_VERSIONS" | grep -Eq '^[0-9]{14}( [0-9]{14})*$'; then
                echo "::error::repair_versions must be 14-digit versions separated by single spaces."
                exit 1
              fi
              # shellcheck disable=SC2086 # one argument per version
              pnpm exec supabase migration repair --linked --status "$REPAIR_STATUS" $REPAIR_VERSIONS
              pnpm exec supabase migration list --linked
              ;;
            config-diff) pnpm exec supabase config diff ;;
            config-push)
              # Without the key the CLI would push an empty SMTP password and
              # sign-in codes would stop arriving.
              if [ -z "$SUPABASE_AUTH_SMTP_PASSWORD" ]; then
                echo "::error::The SUPABASE_AUTH_SMTP_PASSWORD repository secret is missing."
                exit 1
              fi
              pnpm exec supabase config push --yes
              pnpm exec supabase config diff
              ;;
            backups)
              # Supabase's daily backups (docs/implementation/backup-restore.md).
              api="https://api.supabase.com/v1/projects/$PROJECT_REF/database"
              auth=(--fail --silent --show-error --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN")
              curl "${auth[@]}" "$api/backups/schedule" | jq '{daily_at_utc: .schedule_for}'
              curl "${auth[@]}" "$api/backups" | jq '{pitr_enabled, backups: [.backups[] | {status, inserted_at, physical: .is_physical_backup}]}'
              ;;
          esac
