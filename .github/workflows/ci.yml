name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install pnpm
        run: npm install --global --allow-scripts=pnpm pnpm@12.8.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run quality checks
        run: pnpm check

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install pnpm
        run: npm install --global --allow-scripts=pnpm pnpm@12.8.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Start isolated local database and Auth
        run: pnpm db:start

      - name: Expose local stack settings to later steps
        run: |
          pnpm env:local
          grep -E '^[A-Z_]+=' .env >> "$GITHUB_ENV"

      - name: Rebuild database from migrations
        run: pnpm db:reset

      - name: Run database tests
        run: pnpm db:test

      - name: Verify generated database types match migrations
        run: pnpm db:types:check

      - name: Run server integration tests against the database
        run: pnpm test:integration

      - name: Stop local database
        if: always()
        run: pnpm db:stop

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install pnpm
        run: npm install --global --allow-scripts=pnpm pnpm@12.8.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm --filter @lanbort/web exec playwright install --with-deps chromium

      - name: Start isolated local database and Auth
        run: pnpm db:start

      - name: Expose local stack settings to later steps
        run: |
          pnpm env:local
          grep -E '^[A-Z_]+=' .env >> "$GITHUB_ENV"

      - name: Build web app
        run: pnpm --filter @lanbort/web build

      - name: Run browser tests
        # Stewards' passkeys need a domain, so their test runs on localhost.
        env:
          APP_URL: http://localhost:3100
        run: pnpm --filter @lanbort/web test:e2e

      - name: Stop local database
        if: always()
        run: pnpm db:stop

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out full history
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install pnpm
        run: npm install --global --allow-scripts=pnpm pnpm@12.8.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=high

      - name: Prove secret scanner detects a known test secret
        run: scripts/security/secret-scan.sh selftest

      - name: Scan repository for committed secrets
        run: scripts/security/secret-scan.sh repo
