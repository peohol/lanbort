name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install pnpm
        run: npm install --global --allow-scripts=pnpm pnpm@12.8.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run quality checks
        run: pnpm check

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install pnpm
        run: npm install --global --allow-scripts=pnpm pnpm@12.8.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Start isolated local database
        run: pnpm db:start

      - name: Rebuild database from migrations
        run: pnpm db:reset

      - name: Run database tests
        run: pnpm db:test

      - name: Smoke-test server database adapter
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: pnpm --filter @lanbort/database test:integration

      - name: Stop local database
        if: always()
        run: pnpm db:stop

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out full history
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install pnpm
        run: npm install --global --allow-scripts=pnpm pnpm@12.8.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=high

      - name: Prove secret scanner detects a known test secret
        shell: bash
        run: |
          mkdir -p /tmp/gitleaks-selftest
          printf '%s%s\n' 'token = "ghp_' 'aBcDeFgHiJkLmNoPqRsTuVwXyZ0123456789"' > /tmp/gitleaks-selftest/repro.txt

          set +e
          docker run --rm -v /tmp/gitleaks-selftest:/scan ghcr.io/gitleaks/gitleaks:v8.30.0@sha256:691af3c7c5a48b16f187ce3446d5f194838f91238f27270ed36eef6359a574d9 detect --no-git --source /scan/repro.txt --exit-code 42 --no-banner
          status=$?
          set -e

          test "$status" -eq 42

      - name: Scan repository for committed secrets
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.0@sha256:691af3c7c5a48b16f187ce3446d5f194838f91238f27270ed36eef6359a574d9 detect --source /repo --redact --exit-code 1 --no-banner
