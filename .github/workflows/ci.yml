name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - phase-0/implementation-foundation

permissions:
  contents: read

jobs:
  bootstrap-lockfile:
    if: github.event_name == 'push' && github.ref == 'refs/heads/phase-0/implementation-foundation'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install pnpm
        run: npm install --global --allow-scripts=pnpm pnpm@12.8.1

      - name: Generate lockfile
        run: pnpm install --lockfile-only --no-frozen-lockfile

      - name: Commit lockfile if needed
        shell: bash
        run: |
          if git ls-files --error-unmatch pnpm-lock.yaml >/dev/null 2>&1 &&
             git diff --quiet -- pnpm-lock.yaml; then
            echo "Lockfile already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "chore: lock dependencies"
          git push origin "HEAD:${GITHUB_REF_NAME}"

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install pnpm
        run: npm install --global --allow-scripts=pnpm pnpm@12.8.1

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Run quality checks
        run: pnpm check

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install pnpm
        run: npm install --global --allow-scripts=pnpm pnpm@12.8.1

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Start isolated local database
        run: pnpm db:start

      - name: Rebuild database from migrations
        run: pnpm db:reset

      - name: Run database tests
        run: pnpm db:test

      - name: Smoke-test server database adapter
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: pnpm --filter @lanbort/database test:integration

      - name: Stop local database
        if: always()
        run: pnpm db:stop

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out full history
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install pnpm
        run: npm install --global --allow-scripts=pnpm pnpm@12.8.1

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=high

      - name: Prove secret scanner detects a known test secret
        shell: bash
        run: |
          mkdir -p /tmp/gitleaks-selftest
          printf '%s%s\n' 'token = "ghp_' 'aBcDeFgHiJkLmNoPqRsTuVwXyZ0123456789"'             > /tmp/gitleaks-selftest/repro.txt

          set +e
          docker run --rm             -v /tmp/gitleaks-selftest:/scan             ghcr.io/gitleaks/gitleaks:v8.30.0@sha256:691af3c7c5a48b16f187ce3446d5f194838f91238f27270ed36eef6359a574d9             detect --no-git --source /scan/repro.txt --exit-code 42 --no-banner
          status=$?
          set -e

          test "$status" -eq 42

      - name: Scan repository for committed secrets
        run: |
          docker run --rm             -v "$PWD:/repo"             ghcr.io/gitleaks/gitleaks:v8.30.0@sha256:691af3c7c5a48b16f187ce3446d5f194838f91238f27270ed36eef6359a574d9             detect --source /repo --redact --exit-code 1 --no-banner
