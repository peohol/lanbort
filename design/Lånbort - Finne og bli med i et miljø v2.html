    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).

    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.

      ? window.origin

      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.

        (e.origin === 'null' &&

            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')

    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }

      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;

        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }

        if (isPageRoot || window.parent === window) return; // authoritative miss

        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.

        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'

        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;

    setStatus('Unpacking ' + uuids.length + ' assets...');

      const entry = manifest[uuid];

              const { done, value } = await reader.read();

            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }

          }

          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.

            (entry.compressed ? toBase64(finalBytes) : entry.data);

          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);

        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);

    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {

    }

    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {

      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';

    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

ckground:#fff;box-shadow:0 1px 2px rgba(30,40,60,.08)}\n.L .dni.on .ic{stroke-width:2.1;fill:#FBE8DF}\n.L .cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}\n.L .cal span{height:40px;border-radius:12px;display:grid;place-items:center;font-size:15px;font-weight:700;background:#DFF0E6;color:#1F5E3A}\n.L .cal .x{background:#E9EBF0;color:#4F5967;font-weight:400;text-decoration:line-through}\n.L .cal .hd{background:none;height:18px;font-size:13px;color:#56606E;font-weight:500;text-decoration:none}\n.L .tcard{background:#fff;border-radius:22px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 1px 3px rgba(30,40,60,.09)}\n<\u002Fstyle>\n<\u002Fhelmet>\n<div class=\"L\" style=\"{{ rootStyle }}\">\n\n<div class=\"doc\">\n<div class=\"row\" style=\"gap:12px;align-items:baseline\"><span style=\"font:600 11px ui-monospace,Menlo,monospace;padding:3px 7px;background:#1E2733;color:#fff;border-radius:4px;white-space:nowrap;flex:none\">Fase 4 · kjerneflyt 3 · v2<\u002Fspan><span class=\"hq\" style=\"font-size:28px\">Finne, bli medlem av og bruke et miljø<\u002Fspan><\u002Fdiv>\n<p class=\"s\" style=\"margin:0;max-width:1100px;color:#1E2733\">Ingrid Berg har nettopp flyttet inn i Borettslaget Lia. Tirsdag 6. oktober søker hun i Finn, leser om miljøet og søker om å bli med. Onsdag 7. oktober godkjenner administratorene søknaden, og hun finner Kari Nordmanns høytrykksspyler i miljøet. Torsdag 8. oktober får hun en invitasjon til et skjult miljø i Hjem. Øverste rad er normalforløpet for et lukket miljø, midtre rad viser åpent miljø, ventetilstander og avvik under steget der de oppstår, nederste rad viser invitasjon til et skjult miljø. Produktatferden følger PS-ENV-001, -004–006, -008, -010, -012, -014–015, UX-JRN-002, UX-IA-004, UX-PRIV-002, -008–009 og inventaret «Finn», «Miljøets side», «Innmelding og invitasjon» og «Medlemsliste» (WP-80, WP-84). Datoer og navn er eksempler.<\u002Fp>\n<p class=\"s\" style=\"margin:0;max-width:1100px\"><b>Navigasjon:<\u002Fb> Miljøer brukeren ikke er med i, åpnes fra Finn og ligger i Finn-stabelen. Egne miljøer åpnes fra «Dine miljøer» i Hjem. Varsler og invitasjoner er direkte innganger og bygger stabelen Hjem › miljøet. Miljøet har ingen egne varianter av lån eller profil; tingens side og forespørselen er de samme som i kjerneflyt 1.<\u002Fp>\n<p class=\"s\" style=\"margin:0;max-width:1100px\"><b>Finjustert i v2:<\u002Fb> Tingens side (06) er den godkjente fra kjerneflyt 1 v2, med tilgjengelighetskalender og vilkår før «Be om å låne». Tilbakeveien følger inngangen: åpnet fra Finn er den Finn, også når brukeren allerede er medlem; åpnet fra Hjem eller et varsel er den Hjem. Avkrysningen for regler er tom i åpne, lukkede og skjulte miljøer, og reglene står på samme side som avkrysningen. «Velkommen» vises bare ved første besøk etter innmelding (05a); senere besøk starter med søk og ledige ting (05b). Forventet behandlingstid er fjernet. Sending og ukjent utfall ved nettverksbrudd vises under steg 03.<\u002Fp>\n<div style=\"display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;max-width:1100px\">\n<div class=\"tier\"><span class=\"ty\">ALLE INNLOGGEDE · ÅPNE OG LUKKEDE MILJØER<\u002Fspan><span class=\"s\" style=\"font-size:14.5px;color:#1E2733\">Navn, sted, beskrivelse, hvem miljøet er for, hva slags ting det er ment for, regler og krav ved innmelding, omtrentlig medlemstall.<\u002Fspan><span class=\"s\" style=\"font-size:14px\">Skjulte miljøer vises aldri, verken i søk, lenker eller feilmeldinger.<\u002Fspan><\u002Fdiv>\n<div class=\"tier\"><span class=\"ty\">AKTIVE MEDLEMMER I TILLEGG<\u002Fspan><span class=\"s\" style=\"font-size:14.5px;color:#1E2733\">Tingene i miljøet og hvem som eier dem, medlemslisten med roller, spørsmål om ting, kontakt med administratorene.<\u002Fspan><span class=\"s\" style=\"font-size:14px\">Passive medlemmer vises ikke i listen.<\u002Fspan><\u002Fdiv>\n<div class=\"tier\"><span class=\"ty\">ADMINISTRATORER I TILLEGG<\u002Fspan><span class=\"s\" style=\"font-size:14.5px;color:#1E2733\">Innmeldinger med svarene på kravene, ting som venter på godkjenning, invitasjoner, sakskø og innstillinger.<\u002Fspan><span class=\"s\" style=\"font-size:14px\">Vises som oppgaver på miljøets side og i Hjem, med rollen tydelig merket.<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div class=\"lane\">\n<div><\u002Fdiv>\n<div class=\"colh\"><span class=\"num\">01<\u002Fspan><span class=\"hq\" style=\"font-size:20px\">Finn miljøer<\u002Fspan><span class=\"s\">Søk i Finn, fanen «Miljøer». Treffet viser type og hvordan man blir med.<\u002Fspan><\u002Fdiv>\n<div class=\"colh\"><span class=\"num\">02<\u002Fspan><span class=\"hq\" style=\"font-size:20px\">Miljøets side før medlemskap<\u002Fspan><span class=\"s\">Det offentlige: formål, hvem det er for, krav. Det medlemmer ser, er bare nevnt.<\u002Fspan><\u002Fdiv>\n<div class=\"colh\"><span class=\"num\">03<\u002Fspan><span class=\"hq\" style=\"font-size:20px\">Søk om å bli med<\u002Fspan><span class=\"s\">Lukket miljø. Krav og regler på én side. Avkrysningen er tom til brukeren krysser av selv.<\u002Fspan><\u002Fdiv>\n<div class=\"colh\"><span class=\"num\">04<\u002Fspan><span class=\"hq\" style=\"font-size:20px\">Søknaden venter<\u002Fspan><span class=\"s\">Ingen primærhandling. Overskriften sier hvem det ventes på.<\u002Fspan><\u002Fdiv>\n<div class=\"colh\"><span class=\"num\">05<\u002Fspan><span class=\"hq\" style=\"font-size:20px\">Medlem<\u002Fspan><span class=\"s\">Første besøk viser «Velkommen». Senere besøk starter med søk og ledige ting.<\u002Fspan><span class=\"mile\">Medlemskapet er aktivt<\u002Fspan><\u002Fdiv>\n<div class=\"colh\"><span class=\"num\">06<\u002Fspan><span class=\"hq\" style=\"font-size:20px\">Finn noe å låne<\u002Fspan><span class=\"s\">Tingens side fra kjerneflyt 1 v2, uendret: kalender, vilkår og «Be om å låne». Bare tilbakeveien viser miljøet.<\u002Fspan><\u002Fdiv>\n<div class=\"colh\"><span class=\"num\">07<\u002Fspan><span class=\"hq\" styl ide for medlemmer, uten «Velkommen». Tilbakeveien er «‹ Finn», og Finn er fortsatt aktivt område. Hjem brukes bare når miljøet åpnes fra Hjem.<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n\n<div class=\"cell stack\">\n<div class=\"acd\"><div class=\"who\">Åpent miljø · ikke medlem<\u002Fdiv><div class=\"cd\" style=\"gap:10px\">\n<span class=\"ty\">MILJØ<\u002Fspan>\n<span class=\"hq\" style=\"font-size:22px;line-height:1.15;margin-top:-6px\">Nabodeling Lia og Tåsen<\u002Fspan>\n<span class=\"pill p-wt\"><svg class=\"ic\" sc-camel-view-box=\"0 0 24 24\"><path d=\"M6 11h12v9H6zM9 11V8a3 3 0 0 1 5.8-1\"><\u002Fpath><\u002Fsvg>Åpent miljø<\u002Fspan>\n<span class=\"s\" style=\"color:#1E2733\">Alle som bor i området. Lån av og til naboen, fra stekeovner til stiger.<\u002Fspan>\n<div class=\"li\"><svg class=\"ic\" sc-camel-view-box=\"0 0 24 24\"><path d=\"M5 12.5l4.5 4.5L19 7.5\"><\u002Fpath><\u002Fsvg><span>Bekreft at du bor på Lia eller Tåsen<\u002Fspan><\u002Fdiv>\n<div class=\"lockrow\"><svg class=\"ic\" sc-camel-view-box=\"0 0 24 24\"><path d=\"M6 11h12v9H6zM9 11V8a3 3 0 0 1 6 0v3\"><\u002Fpath><\u002Fsvg><span>Tingene og medlemmene ser du når du er med.<\u002Fspan><\u002Fdiv>\n<div class=\"btn\">Bli med<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<div class=\"acd\"><div class=\"who\">Lenke til miljø som ikke finnes eller er skjult<\u002Fdiv><div class=\"cd\">\n<span class=\"hq now\" style=\"font-size:20px\">Vi finner ikke denne siden<\u002Fspan>\n<span class=\"s\">Lenken kan være feil, eller siden er ikke tilgjengelig for deg.<\u002Fspan>\n<div class=\"btn2\">Gå til Finn<\u002Fdiv>\n<span class=\"s\" style=\"font-size:14px\">Samme svar uansett grunn. Røper aldri at et skjult miljø finnes.<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<div class=\"acd\"><div class=\"who\">Miljøet avvikles<\u002Fdiv><div class=\"cd\">\n<span class=\"pill p-wt\"><svg class=\"ic\" sc-camel-view-box=\"0 0 24 24\"><path d=\"M12 4a8 8 0 1 0 0 16a8 8 0 1 0 0-16M8 12h8\"><\u002Fpath><\u002Fsvg>Tar ikke inn nye medlemmer<\u002Fspan>\n<span class=\"s\">Borettslaget Lia avvikles. Det er ikke mulig å bli med eller låne gjennom miljøet nå.<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<div class=\"acd\"><div class=\"who\">Stengt for nye forsøk<\u002Fdiv><div class=\"cd\">\n<span class=\"pill p-wt\"><svg class=\"ic\" sc-camel-view-box=\"0 0 24 24\"><path d=\"M12 4a8 8 0 1 0 0 16a8 8 0 1 0 0-16M8 12h8\"><\u002Fpath><\u002Fsvg>Kan ikke søke<\u002Fspan>\n<span class=\"s\">Du kan ikke søke om å bli med i dette miljøet.<\u002Fspan>\n<span class=\"s\" style=\"font-size:14px\">Nøytral tekst. Ingen knapp til søknaden.<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n\n<div class=\"cell stack\">\n<div class=\"acd\"><div class=\"who\">«Send søknaden» · mens den sendes<\u002Fdiv><div class=\"cd\" role=\"status\" style=\"gap:12px\">\n<div class=\"fld\"><label>Leilighetsnummer<\u002Flabel><div class=\"box\" style=\"background:#F3F4F7\">B 304<\u002Fdiv><\u002Fdiv>\n<div class=\"chk\"><i class=\"on\"><svg class=\"ic\" sc-camel-view-box=\"0 0 24 24\"><path d=\"M5 12.5l4.5 4.5L19 7.5\"><\u002Fpath><\u002Fsvg><\u002Fi><span class=\"f1\" style=\"font-weight:700\">Jeg godtar reglene<\u002Fspan><\u002Fdiv>\n<div class=\"btn busy\" aria-disabled=\"true\"><svg class=\"ic\" sc-camel-view-box=\"0 0 24 24\"><path d=\"M12 4a8 8 0 1 0 8 8\"><\u002Fpath><\u002Fsvg>Sender søknaden …<\u002Fdiv>\n<span class=\"s\" style=\"font-size:14px\">Feltene er låst, og knappen kan ikke trykkes igjen før svaret er kommet.<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<div class=\"acd\"><div class=\"who\">Forbindelsen brøt · utfallet er ukjent<\u002Fdiv><div class=\"cd\" role=\"status\" style=\"gap:10px\">\n<span class=\"pill p-wt\"><svg class=\"ic\" sc-camel-view-box=\"0 0 24 24\"><path d=\"M12 4a8 8 0 1 0 0 16a8 8 0 1 0 0-16M12 8v4M12 15.5v.5\"><\u002Fpath><\u002Fsvg>Ikke bekreftet<\u002Fspan>\n<span class=\"hq now\" style=\"font-size:20px\">Vi vet ikke om søknaden kom fram<\u002Fspan>\n<span class=\"s\">Forbindelsen ble brutt mens søknaden ble sendt. Den kan allerede være mottatt. Vi sjekker automatisk når du er på nett igjen.<\u002Fspan>\n<div class=\"btn2\">Sjekk nå<\u002Fdiv>\n<span class=\"s\" style=\"font-size:14px\">Ingen «Send på nytt». Sjekken gjelder den samme søknaden, så den kan ikke bli sendt to ganger. Svaret og avkrysningen er tatt vare på.<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<div class=\"acd\"><div class=\"who\">Etter sjekken<\u002Fdiv><div class=\"cd\" style=\"gap:8px\">\n<div class=\"li\"><svg class=\"ic\" sc-camel-view-box=\"0 0 24 24\"><path d=\"M5 12.5l4.5 4.5L19 7.5\"><\u002Fpath><\u002Fsvg><span><b>Kom fram:<\u002Fb> «Søknaden venter» (04) vises, med samme sendetidspunkt.<\u002Fspan><\u002Fdiv>\n<div class=\"li\"><svg class=\"ic\" sc-camel-view-box=\"0 0 24 24\"><path d=\"M12 4a8 8 0 1 0 0 16a8 8 0 1 0 0-16M8 12h8\"><\u002Fpath><\u002Fsvg><span><b>Kom ikke fram:<\u002Fb> Søknaden åpnes igjen med svaret og avkrysningen beholdt. Brukeren sender selv.<\u002Fspan><\u002Fdiv>\n<\u002Fdiv><\u002Fdiv>\n<div class=\"acd\"><div class=\"who\">Åpent miljø · «Bli med»<\u002Fdiv><div class=\"cd\" style=\"gap:12px\">\n<span class=\"hq now\" style=\"font-size:20px\">Bli med i Nabodeling Lia og Tåsen<\u002Fspan>\n<div class=\"cd ol\" style=\"gap:6px;padding:14px 16px\">\n<span class=\"ty\">REGLER<\u002Fspan>\n<div class=\"li\"><span class=\"num\" style=\"width:20px\">1<\u002Fspan><span>Lån bare ut til og av folk i området.<\u002Fspan><\u002Fdiv>\n<div class=\"li\"><span class=\"num\" style=\"width:20px\">2<\u002Fspan><span>Lever tilbake som avtalt med eieren.<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<div class=\"chk\"><i role=\"checkbox\" aria-checked=\"false\"><\u002Fi><span class=\"f1\">Jeg bor på Lia eller Tåsen<\u002Fspan><\u002Fdiv>\n<div class=\"chk\"><i role=\"checkbox\" aria-checked=\"false\"><\u002Fi><span class=\"f1\">Jeg godtar reglene<\u002Fspan><\u002Fdiv>\n<span class=\"s\" style=\"font-size:14px\">Begge er tomme til brukeren krysser av. Ingen vurderer dette; du er medlem så snart du trykker. Under innmelding står det «Melder deg inn …», og ved brudd gjelder samme sjekk som for søknader.<\u002Fspan>\n<div class=\"btn\">Bli med<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<div class=\"acd\"><div class=\"who\">Rett etter · åpent miljø<\u002Fdiv><div class=\"cd\" role=\"status\">\n<span class=\"pill p-on\"><svg class=\"ic\" sc-camel-view-box=\"0 0 24 24\"><path d=\"M5 12.5l4.5 4.5L19 7.5\"><\u002Fpath><\u002Fsvg>Medlem<\u002Fspan>\n<span class=\"hq now\" style=\"font-size:20px\">Du er med i Nabodeling Lia og Tåsen<\u002Fspan>\n<span class=\"s\">Miljøets side viser nå tingene. Du finner miljøet under «Dine miljøer» i Hjem.<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<div class=\"acd\"><div class=\"who\">Mangler · ved «Send søknaden»<\u002Fdiv><div class=\"cd\" style=\"gap:12px\">\n<div class=\"fld\"><label>Leilighetsnummer<\u002Flabel><div class=\"box bad\"><\u002Fdiv><span class=\"err\"><svg class=\"ic\" sc-camel-view-box=\"0 0 24 24\"><path d=\"M12 4l9 16H3zM12 10v4M12 17v.5\"><\u002Fpath><\u002Fsvg>Skriv leilighetsnummeret ditt.<\u002Fspan><\u002Fdiv>\n<div class=\"chk\"><i class=\"bad\"><\u002Fi><span class=\"f1\" style=\"font-weight:700\">Jeg godtar reglene<\u002Fspan><\u002Fdiv>\n<span class=\"err\"><svg class=\"ic\" sc-camel-view-box=\"0 0 24 24\"><path d=\"M12 4l9 16H3zM12 10v4M12 17v.5\"><\u002Fpath><\u002Fsvg>Du må godta reglene for å bli med.<\u002Fspan>\n<span class=\"s\" style=\"font-size:14px\">Fokus flyttes til første felt som mangler. Samme i åpne miljøer og invitasjoner.<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n\n<div class=\"cell stack\">\n<div class=\"acd\"><div class=\"who\">Administratorene ber om mer<\u002Fdiv><div class=\"cd\">\n<span class=\"pill p-me\"><svg class=\"ic\" sc-camel-view-box=\"0 0 24 24\"><circle cx=\"12\" cy=\"12\" r=\"8\"><\u002Fcircle><circle cx=\"12\" cy=\"12\" r=\"3\" fill=\"currentColor\"><\u002Fcircle><\u002Fsvg>Venter på deg<\u002Fspan>\n<span class=\"hq now\" style=\"font-size:20px\">Administratorene trenger mer informasjon<\u002Fspan>\n<div class=\"msg\">Står du på kontrakten for B 304, eller bor du hos noen som gjør det?<\u002Fdiv>\n<span class=\"s\" style=\"font-size:14px\">Svaret går til søknaden, ikke til privat chat.<\u002Fspan>\n<div class=\"btn\">Svar på spørsmålet<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<div class=\"acd\"><div class=\"who\">Søknaden avslått<\u002Fdiv><div class=\"cd\">\n<span class=\"pill p-wt\"><svg class=\"ic\" sc-camel-view-box=\"0 0 24 24\"><path d=\"M12 4a8 8 0 1 0 0 16a8 8 0 1 0 0-16M8 12h8\"><\u002Fpath><\u002Fsvg>Ikke godkjent<\u002Fspan>\n<span class=\"hq now\" style=\"font-size:20px\">Søknaden ble ikke godkjent<\u002Fspan>\n<span class=\"s\">Administratorene i Borettslaget Lia har avslått søknaden. Du kan søke på nytt senere.<\u002Fspan>\n<div class=\"btn2\">Finn andre miljøer<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<div class=\"acd\"><div class=\"who\">Nye krav mens søknaden venter<\u002Fdiv><div class=\"cd\">\n<span class=\"pill p-me\"><svg class=\"ic\" sc-camel-view-box=\"0 0 24 24\"><circle cx=\"12\" cy=\"12\" r=\"8\"><\u002Fcircle><circle cx=\"12\" cy=\"12\" r=\"3\" fill=\"currentColor\"><\u002Fcircle><\u002Fsvg>Venter på deg<\u002Fspan>\n<span class=\"hq now\" style=\"font-size:20px\">Miljøet har nye regler<\u002Fspan>\n<span class=\"s\">Søknaden står på vent til du har lest og godtatt dem.<\u002Fspan>\n<div class=\"btn\">Se de nye reglene<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<div class=\"acd\"><div class=\"who\">Ingen administrator kan behandle nå<\u002Fdiv><div class=\"cd\">\n<span class=\"pill p-wt\"><svg class=\"ic\" sc-camel-view-box=\"0 0 24 24\"><path d=\"M12 4a8 8 0 1 0 0 16a8 8 0 1 0 0-16M12 8v4l3 2\"><\u002Fpath><\u002Fsvg>Står på vent<\u002Fspan>\n<span class=\"s\">Ingen administrator kan behandle søknader i Borettslaget Lia akkurat nå. Søknaden din ligger trygt til noen kan.<\u002Fspan>\n<span class=\"s\" style=\"font-size:14px\">Ingen «send til plattformen»-knapp.<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<div class=\"acd\"><div class=\"who\">«Trekk søknaden»<\u002Fdiv><div class=\"cd\" style=\"gap:10px\">\n<span class=\"hq now\" style=\"font-size:20px\">Trekke søknaden?<\u002Fspan>\n<span class=\"s\">Administratorene ser ikke lenger søknaden. Du kan søke på nytt senere.<\u002Fspan>\n<div class=\"bn\">Trekk søknaden<\u002Fdiv>\n<div class=\"btn2\">Behold søknaden<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n\n<div class=\"cell stack\">\n<div class=\"acd\"><div class=\"who\">Ingen ting i miljøet ennå<\u002Fdiv><div class=\"cd\">\n<span class=\"hq now\" style=\"font-size:20px\">Ingen ting her ennå<\u002Fspan>\n<span class=\"s\">Bli den første som legger ut noe i Nabodeling Lia og Tåsen.<\u002Fspan>\n<div class=\"btn\"><svg class=\"ic\" sc-camel-view-box=\"0 0 24 24\"><path d=\"M12 5v14M5 12h14\"><\u002Fpath><\u002Fsvg>Registrer en ting her<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<div class=\"acd\"><div class=\"who\">«Registrer en ting her» · samme skjema<\u002Fdiv><div class=\"cd\">\n<span class=\"s\">Åpner de fire stegene fra kjerneflyt 2. I «Hvem kan låne» er miljøet forhåndsvalgt:<\u002Fspan>\n<div class=\"chk\"><i class=\"on\"><svg class=\"ic\" sc-camel-view-box=\"0 0 24 24\"><path d=\"M5 12.5l4.5 4.5L19 7.5\"><\u002Fpath><\u002Fsvg><\u002Fi><div class=\"f1\"><div style=\"font-weight:700\">Borettslaget Lia<\u002Fdiv><div class=\"s\" style=\"font-size:14px\">Valgt fordi du startet her<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<span class=\"s\" style=\"font-size:14px\">Tingen blir Ingrids, ikke miljøets.<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<div class=\"acd\"><div class=\"who\">Samme side · sett av en administrator<\u002Fdiv><div class=\"cd\" style=\"gap:10px\">\n<div class=\"ctx\" style=\"color:#2B4A8A;font-weight:700\"><svg class=\"ic\" sc-camel-view-box=\"0 0 24 24\"><path d=\"M12 3l7 3v5c0 4.5-3 8-7 10c-4-2-7-5.5-7-10V6z\"><\u002Fpath><\u002Fsvg>Du er administrator her<\u002Fdiv>\n<span class=\"ty\">SOM ADMINISTRATOR<\u002Fspan>\n<div class=\"lrow\" style=\"box-shadow:inset 0 0 0 1.5px #DEE1E8;padding:10px 14px\"><span class=\"f1\" style=\"font-weight:700;font-size:15px\">Behandle 2 innmeldinger<\u002Fspan><svg class=\"ic chev\" sc-camel-view-box=\"0 0 24 24\"><path d=\"M9 5l7 7-7 7\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n<div class=\"lrow\" style=\"box-shadow:inset 0 0 0 1.5px #DEE1E8;padding:10px 14px\"><span class=\"f1\" style=\"font-weight:700;font-size:15px\">Vurder 1 ting<\u002Fspan><svg class=\"ic chev\" sc-camel-view-box=\"0 0 24 24\"><path d=\"M9 5l7 7-7 7\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n<span class=\"q\" style=\"font-size:14px;min-height:36px\">Administrer miljøet<\u002Fspan>\n<span class=\"s\" style=\"font-size:14px\">Vises over tingene, bare for administratorer. Vanlige medlemmer ser ikke at seksjonen finnes.<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n\n<div class=\"cell stack\">\n<div class=\"acd\"><div class=\"who\">Tingen er ikke lenger i miljøet<\u002Fdiv><div class=\"cd\">\n<span class=\"hq now\" style=\"font-size:20px\">Denne tingen er ikke tilgjengelig lenger<\u002Fspan>\n<span class=\"s\">Den er fjernet fra Borettslaget Lia. Har du sendt en forespørsel, er den avsluttet.<\u002Fspan>\n<div class=\"btn2\">Tilbake til Borettslaget Lia<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<div class=\"acd\"><div class=\"who\">Ikke ledig · uten grunn<\u002Fdiv><div class=\"cd\">\n<span class=\"pill p-wt\"><svg class=\"ic\" sc-camel-view-box=\"0 0 24 24\"><path d=\"M12 4a8 8 0 1 0 0 16a8 8 0 1 0 0-16M8 12h8\"><\u002Fpath><\u002Fsvg>Ikke ledig nå<\u002Fspan>\n<span class=\"s\">Partytelt 3 × 6 m er ikke ledig nå. Du kan følge tingen og få beskjed når den blir ledig.<\u002Fspan>\n<div class=\"btn2\">Følg tingen<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n\n<div class=\"cell stack\">\n<div class=\"acd\"><div class=\"who\">«Forlat miljøet» · bekreftelse<\u002Fdiv><div class=\"cd\" style=\"gap:10px\">\n<span class=\"hq now\" style=\"font-size:20px\">Forlate Borettslaget Lia?<\u002Fspan>\n<div class=\"li\"><svg class=\"ic\" sc-camel-view-box=\"0 0 24 24\"><path d=\"M5 12.5l4.5 4.5L19 7.5\"><\u002Fpath><\u002Fsvg><span>Lån som er godkjent, fortsetter som avtalt.<\u002Fspan><\u002Fdiv>\n<div class=\"li\"><svg class=\"ic\" sc-camel-view-box=\"0 0 24 24\"><path d=\"M12 4a8 8 0 1 0 0 16a8 8 0 1 0 0-16M8 12h8\"><\u002Fpath><\u002Fsvg><span>Tingene dine forsvinner fra miljøet. Åpne forespørsler herfra avsluttes.<\u002Fspan><\u002Fdiv>\n<div class=\"li\"><svg class=\"ic\" sc-camel-view-box=\"0 0 24 24\"><path d=\"M12 4a8 8 0 1 0 0 16a8 8 0 1 0 0-16M8 12h8\"><\u002Fpath><\u002Fsvg><span>Du ser ikke lenger miljøets ting og medlemmer.<\u002Fspan><\u002Fdiv>\n<div class=\"bdf fo\"><svg class=\"ic\" sc-camel-view-box=\"0 0 24 24\"><path d=\"M14 5h5v14h-5M10 8l-4 4 4 4M6 12h9\"><\u002Fpath><\u002Fsvg>Forlat miljøet<\u002Fdiv>\n<div class=\"btn2\">Bli i miljøet<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<div class=\"acd\"><div class=\"who\">Etter utmelding · et lån pågår<\u002Fdiv><div class=\"cd\">\n<div class=\"ctx\"><svg class=\"ic\" sc-camel-view-box=\"0 0 24 24\"><path d=\"M5 8h14l-3.5-3.5M19 16H5l3.5 3.5\"><\u002Fpath><\u002Fsvg>Lånets side<\u002Fdiv>\n<span class=\"s\">Lånet av høytrykksspyleren fortsetter som avtalt, selv om du ikke lenger er med i Borettslaget Lia.<\u002Fspan>\n<span class=\"s\" style=\"font-size:14px\">Ingen lenke tilbake til miljøet eller medlemmene.<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<div class=\"acd\"><div class=\"who\">Nye krav · 14 dagers frist<\u002Fdiv><div class=\"cd\">\n<span class=\"pill p-me\"><svg class=\"ic\" sc-camel-view-box=\"0 0 24 24\"><circle cx=\"12\" cy=\"12\" r=\"8\"><\u002Fcircle><circle cx=\"12\" cy=\"12\" r=\"3\" fill=\"currentColor\"><\u002Fcircle><\u002Fsvg>Venter på deg<\u002Fspan>\n<span class=\"hq now\" style=\"font-size:20px\">Borettslaget Lia har nye regler<\u002Fspan>\n<span class=\"s\">Godta dem innen <b>tor. 22. okt.<\u002Fb> for å fortsette som aktivt medlem. Ellers blir medlemskapet passivt. Du blir ikke fjernet.<\u002Fspan>\n<div class=\"btn\">Se de nye reglene<\u002Fdiv>\n<span class=\"q\" style=\"font-size:14px;min-height:36px\">Forlat miljøet i stedet<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<div class=\"acd\"><div class=\"who\">Lukket blir åpent · personlig valg<\u002Fdiv><div class=\"cd\" style=\"gap:10px\">\n<span class=\"pill p-me\"><svg class=\"ic\" sc-camel-view-box=\"0 0 24 24\"><circle cx=\"12\" cy=\"12\" r=\"8\"><\u002Fcircle><circle cx=\"12\" cy=\"12\" r=\"3\" fill=\"currentColor\"><\u002Fcircle><\u002Fsvg>Venter på deg<\u002Fspan>\n<span class=\"hq now\" style=\"font-size:20px\">Borettslaget Lia blir åpent<\u002Fspan>\n<span class=\"s\">Da kan alle bli med uten å søke, og flere kan se at du er medlem. Det du har gjort i miljøet til nå, blir ikke mer synlig.<\u002Fspan>\n<span class=\"s\"><b>Svar innen ons. 14. okt.<\u002Fb> Svarer du ikke, blir medlemskapet passivt.<\u002Fspan>\n<div class=\"row\" style=\"gap:8px\"><div class=\"bn f1\">Fortsett som medlem<\u002Fdiv><div class=\"bn f1\">Forlat miljøet<\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<div class=\"acd\"><div class=\"who\">Passivt medlemskap<\u002Fdiv><div class=\"cd\">\n<span class=\"pill p-wt\"><svg class=\"ic\" sc-camel-view-box=\"0 0 24 24\"><path d=\"M12 4a8 8 0 1 0 0 16a8 8 0 1 0 0-16M8 12h8\"><\u002Fpath><\u002Fsvg>Passivt medlem<\u002Fspan>\n<span class=\"s\">Du vises ikke i medlemslisten, og tingene dine er ikke synlige her. Lån du har, fortsetter.<\u002Fspan>\n<div class=\"btn\">Bli aktiv igjen<\u002Fdiv>\n<span class=\"q\" style=\"font-size:14px;min-height:36px\">Forlat miljøet<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv><\u002Fsc-if>\n\n<sc-if value=\"{{ showInvitasjon }}\" hint-placeholder-val=\"{{ true }}\"><div style=\"display:contents\">\n<div class=\"lh\"><span class=\"hq\" style=\"font-size:20px\">Invitasjon<\u002Fspan><span class=\"s\">Skjult miljø. Bare via Hjem, aldri via søk eller lenke.<\u002Fspan><\u002Fdiv>\n\n<div class=\"cell\"><div><div class=\"who\">Tor. 8. okt · Hjem<\u002Fdiv>\n<div class=\"ph\" data-screen-label=\"I1 Hjem med invitasjon\">\n<div
