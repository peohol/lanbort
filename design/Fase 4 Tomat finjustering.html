    // its OWN frames — from local text at the root, or text obtained from

    // navigation stays same-origin with its initiator and a deduped page

    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own

      delete pendingFrames[uuid];

      delete pendingRelays[uuid];

        }

    // consumers read these Blobs directly. Survives the swap like the error sink.

    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.

      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';

    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry

    // preserve ordering (React before ReactDOM before Babel before text/babel).

    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.

        if (typeof text === 'string') {

          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);

        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;

    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"4c304db6-3a48-4629-8b02-1becce57fd82\"><\u002Fscript>\n<\u002Fhead>\n<body>\n<x-dc>\n<helmet>\n<meta name=\"design_doc_mode\" content=\"canvas\">\n\n<style>\nbody{margin:0;background:#e9eaee;font-family:system-ui,-apple-system,sans-serif;color:#1E2733}\na{color:#1E2733}a:hover{color:#8F321F}\n<\u002Fstyle>\n<\u002Fhelmet>\n<section id=\"t1\" style=\"padding:40px 44px 48px;display:flex;flex-direction:column;gap:28px\">\n<div style=\"display:flex;flex-direction:column;gap:10px;max-width:1100px\">\n<div style=\"display:flex;align-items:baseline;gap:10px\"><span style=\"font:600 11px ui-monospace,Menlo,monospace;padding:3px 7px;background:#1E2733;color:#fff;border-radius:4px\">Fase 4<\u002Fspan><span style=\"font-weight:600;font-size:15px\">Tomat: siste finjustering<\u002Fspan><\u002Fdiv>\n<p style=\"margin:0;font-size:14px;line-height:1.55;color:#444\">Til venstre er dagens Tomat, til høyre den finjusterte versjonen. Flatene, typografien og komponentene er de samme på begge sider. Prikken under aktivt menyvalg er fjernet på begge, slik at forskjellen er fargebehandlingen alene. Slå på «grayscale» i Tweaks for å se begge i gråtoner.<\u002Fp>\n<div style=\"display:grid;grid-template-columns:200px 1fr;gap:6px 18px;font-size:13.5px;line-height:1.5;background:#fff;border-radius:12px;padding:16px 18px\">\n<b>Bakgrunn<\u002Fb><span>#F2F4F8 → #F3F4F7. Litt mindre blått, ikke varmere enn nøytral. Linjer (#DEE1E8) og dempede flater (#E9EBF0) følger med.<\u002Fspan>\n<b>Tomat<\u002Fb><span>Hakket varmere og mindre mettet: primær #B5432B → #B0563A, mørk primær #8F321F → #8A3E26, lys primær #FBE6DF → #FBE8DF. Hvit på primærknapp holder AA (ca. 5,0:1). Lysere enn dette går under AA for hvit tekst.<\u002Fspan>\n<b>Fare<\u002Fb><span>Karmin #A3173A → klassisk signalrød #C4122F. Den skiller seg fra den dempede tomaten mest gjennom metning (ca. 91 % mot 67 %) og en kaldere kulør, ikke gjennom lyshet. Fylt destruktiv knapp har hvit tekst og hvitt ikon (ca. 6:1). Farepillen har ramme. Destruktive handlinger er omrisset med ikon, og fylles bare i bekreftelsessteget. Rettet feil: fokusmarkeringen gjorde teksten på den fylte knappen mørk.<\u002Fspan>\n<b>Fokus<\u002Fb><span>Mørk primær → blekkblå #2B4A8A. Fokus skiller seg dermed fra både primær og fare. Ringen ligger 2 px utenfor elementet, på bakgrunn eller flate, og det er der kontrasten måles. Mot selve tomatknappen er kontrasten lav (1,6:1), så ringen må aldri tegnes inni en knapp.<\u002Fspan>\n<b>Aktivt menyvalg<\u002Fb><span>Ingen prikk. I stedet fylt ikon (lys primær), tykkere strek, fet tekst og mørk primær. Formforskjellen mellom fylt og omrisset ikon er synlig også i gråtoner.<\u002Fspan>\n<b>Uendret<\u002Fb><span>Hovedtekst, sekundær tekst, aksent og lys aksent. Tomat brukes fortsatt bare på knapper, aktiv navigasjon og «Nå»-steget, ikke på store flater.<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display:flex;gap:36px;align-items:flex-start\">\n<div style=\"display:flex;flex-direction:column;gap:10px\"><span style=\"font-weight:600;font-size:14px\">Tomat i dag<\u002Fspan><div style=\"background:#fff;border-radius:12px;box-shadow:0 1px 3px rgba(0,0,0,.06)\"><dc-import name=\"Tomat palett\" palette=\"Tomat i dag\" grayscale=\"{{ gray }}\" hint-size=\"1272px,2280px\"><\u002Fdc-import><\u002Fdiv><\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:10px\"><span style=\"font-weight:600;font-size:14px\">Tomat finjustert<\u002Fspan><div style=\"background:#fff;border-radius:12px;box-shadow:0 1px 3px rgba(0,0,0,.06)\"><dc-import name=\"Tomat palett\" palette=\"Tomat finjustert\" grayscale=\"{{ gray }}\" hint-size=\"1272px,2280px\"><\u002Fdc-import><\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;grayscale&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Test&quot;}}\">\nclass Component extends DCLogic {\n  renderVals() { return { gray: this.props.grayscale === true || this.props.grayscale === 'true' }; }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
