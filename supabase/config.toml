project_id = "lanbort"

[api]
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
major_version = 17

[db.migrations]
enabled = true

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

# Local Auth for development and tests (WP-10). Hosted projects are configured
# separately; see docs/implementation/local-development.md.
[auth]
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://127.0.0.1:3000/**", "http://localhost:3000/**"]
enable_signup = true
enable_anonymous_sign_ins = false
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10

# Every Auth call comes from the server, which limits codes per address and
# per client itself (WP-73), so Auth's own per-IP limits must not bind.
[auth.rate_limit]
email_sent = 1000
sign_in_sign_ups = 1000
token_verifications = 1000

# Sign-in is a one-time code sent by e-mail (UX-JRN-001: e-mail, then verify).
[auth.email]
enable_signup = true
enable_confirmations = true
double_confirm_changes = true
max_frequency = "1s"
otp_length = 6
otp_expiry = 600

[auth.email.template.confirmation]
subject = "Din kode til Lånbort"
content_path = "./supabase/templates/email-code.html"

[auth.email.template.magic_link]
subject = "Din kode til Lånbort"
content_path = "./supabase/templates/email-code.html"

# The mechanism for stronger authentication is not decided (OD-0010), so no
# second factor is offered and the app trusts none (account/identity.ts).
[auth.mfa.totp]
enroll_enabled = false
verify_enabled = false

[storage]
enabled = true

[experimental.pgdelta]
enabled = true

# Hosted production (https://lanbort.vercel.app). Only what differs from local
# development is overridden here; .github/workflows/supabase-production.yml
# deploys migrations and this configuration with the Supabase CLI.
[remotes.production]
project_id = "abgivjcloxembtnzfnyv"

[remotes.production.auth]
site_url = "https://lanbort.vercel.app"
additional_redirect_urls = ["https://lanbort.vercel.app/**"]

# Locally a new code can be sent every second for the tests; in production
# Auth's usual minute between codes to the same address applies.
[remotes.production.auth.email]
max_frequency = "60s"
